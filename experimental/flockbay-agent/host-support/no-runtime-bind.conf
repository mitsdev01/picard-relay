# /etc/systemd/system/picard-updater.service.d/no-runtime-bind.conf
# Do not bind-mount the ephemeral RuntimeDirectory into the updater namespace:
# systemd replaces that directory when the core restarts. Read-only /run still
# permits connecting to its Unix socket, and sees the newly created directory.
[Service]
ReadWritePaths=
ReadWritePaths=/opt/picard-relay /var/lib/picard-updater /var/lib/picard-flockbay-agent
